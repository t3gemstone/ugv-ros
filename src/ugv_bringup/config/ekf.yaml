# robot_localization EKF: wheel odometry + IMU gyroscope -> odom->base_link.
# Takes forward velocity (vx) and lateral velocity (vy = 0, differential constraint)
# from the wheels, and yaw rate from both the wheels and the IMU. The IMU is more
# reliable than the wheels against slip when turning, so its covariance is lower.

ekf_filter_node:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    #            x      y      z      roll   pitch  yaw
    #            vx     vy     vz     vroll  vpitch vyaw
    #            ax     ay     az
    odom0: /wheel/odom
    odom0_config: [false, false, false, false, false, false,
                   true,  true,  false, false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    imu0: /imu/data_raw
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: false
